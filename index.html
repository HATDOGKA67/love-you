<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I love you &lt;3</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 4vh 4vw;
      background:
        linear-gradient(rgba(28, 35, 48, .18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28, 35, 48, .18) 1px, transparent 1px),
        #090b10;
      background-size: 28px 28px;
      font-family: "Courier New", monospace;
    }
    .lost-window {
      position: relative;
      display: grid;
      grid-template-rows: 38px 30px 1fr 28px;
      width: min(780px, 88vw);
      height: min(700px, 82vh);
      min-height: 380px;
      overflow: hidden;
      border: 1px solid #465163;
      border-radius: 8px;
      background: #050608;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .04);
      animation: window-flicker 6s steps(1, end) infinite;
    }
    .window-bar, .tab-bar, .status-bar { display: flex; align-items: center; }
    .window-bar {
      justify-content: space-between;
      padding: 0 12px;
      background: #202632;
      color: #aeb8c8;
      font: 700 11px/1 "Courier New", monospace;
      letter-spacing: .04em;
    }
    .window-title { display: flex; align-items: center; gap: 9px; }
    .file-mark { color: #ff315e; font-size: 15px; }
    .window-controls { display: flex; gap: 8px; color: #687487; font-size: 11px; }
    .window-controls span { width: 10px; text-align: center; }
    .tab-bar {
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid #252d3a;
      background: #11151c;
      color: #69778d;
      font-size: 11px;
    }
    .tab {
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 175px;
      padding: 0 11px;
      border-right: 1px solid #2b3442;
      border-left: 1px solid #2b3442;
      color: #cbd5e3;
      background: #080a0e;
    }
    .tab-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff315e; box-shadow: 0 0 9px #ff315e; }
    .canvas-frame { position: relative; min-height: 0; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    .status-bar {
      justify-content: space-between;
      padding: 0 10px;
      border-top: 1px solid #252d3a;
      color: #66758a;
      background: #11151c;
      font-size: 9px;
      letter-spacing: .06em;
    }
    .status-error { color: #ff526f; }
    .sound-button {
      position: absolute;
      right: 10px;
      bottom: 7px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 999px;
      padding: .65rem .9rem;
      color: rgba(255, 255, 255, .8);
      background: rgba(0, 0, 0, .45);
      font: 600 .75rem/1 system-ui, sans-serif;
      letter-spacing: .04em;
      cursor: pointer;
      opacity: .7;
      transition: opacity .2s, background .2s, color .2s;
    }
    .sound-button:hover, .sound-button:focus-visible { opacity: 1; background: rgba(20, 35, 55, .7); }
    @keyframes window-flicker { 0%, 96%, 100% { filter: none; } 97% { filter: contrast(1.16) brightness(1.1); } 98% { filter: hue-rotate(18deg); } }
    @media (max-width: 560px) {
      body { padding: 2vh 2vw; }
      .lost-window { width: 94vw; height: 88vh; min-height: 340px; grid-template-rows: 36px 30px 1fr 28px; }
      .tab { min-width: 0; width: 100%; }
      .window-controls { display: none; }
    }
  </style>
</head>
<body>
  <main class="lost-window" aria-label="Recovered lost file window">
    <header class="window-bar">
      <div class="window-title"><span class="file-mark">♥</span><span>LOVE_YOU.EXE - RECOVERED</span></div>
      <div class="window-controls" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
    </header>
    <nav class="tab-bar" aria-label="File tabs">
      <div class="tab"><span class="tab-dot"></span><span>i_love_you.corrupt</span><span>×</span></div>
    </nav>
    <section class="canvas-frame">
      <canvas id="heart" aria-label="A glowing heart made from the words I love you"></canvas>
      <button class="sound-button" id="sound" type="button" aria-label="Enable music">Enable music</button>
    </section>
    <footer class="status-bar"><span class="status-error">FILE STATUS: UNSTABLE</span><span>0xILOVEYOU // LOST</span></footer>
  </main>
  <audio id="music" src="love_you.mp3" autoplay loop preload="auto"></audio>
  <script>
    const canvas = document.getElementById('heart');
    const context = canvas.getContext('2d');
    const music = document.getElementById('music');
    const soundButton = document.getElementById('sound');
    const words = ['love you'];
    const colors = ['#173b8f', '#1e5eff', '#008cff', '#35c7ff', '#5f7dff', '#86e8ff', '#0b2d68'];
    const redColors = ['#8f1028', '#c4143d', '#ed174d', '#ff315e', '#ff5875', '#ff8294', '#700b20'];
    const beatDropStart = 7;
    const beatDropEnd = 18;
    const colorPhaseLength = .62;
    const centerMessage = 'I love you.';
    const secondaryMessage = "You can't escape me.";
    const firstTypeEnd = 9.5;
    const firstDeleteStart = 11.5;
    const secondTypeStart = 12;
    const secondTypeEnd = 16;
    const particles = [];
    const random = (min, max) => min + Math.random() * (max - min);
    const heartPoint = (t) => ({
      x: 16 * Math.sin(t) ** 3,
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
    });

    let width = 0;
    let height = 0;
    let scale = 1;
    let frame = 0;
    let centerStart = 0;
    let autoplayStarted = false;
    let audioContext = null;
    let analyser = null;
    let frequencyData = null;
    let beatAverage = 0;
    let beatCooldown = 0;
    let beatIntensity = 0;
    let beatDropActivated = false;
    let colorMode = 'blue';
    let lastColorPhase = -1;

    function resize() {
      const density = Math.min(window.devicePixelRatio || 1, 2);
      const frame = canvas.parentElement.getBoundingClientRect();
      width = Math.max(1, frame.width);
      height = Math.max(1, frame.height);
      canvas.width = width * density;
      canvas.height = height * density;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      context.setTransform(density, 0, 0, density, 0, 0);
      scale = Math.min(width / 2000, height / 1200) * 20;
    }

    function screenPoint(point, radius = 1) {
      return { x: point.x * scale * radius + width / 2, y: point.y * scale * radius + height / 2 };
    }

    function addParticle(point, kind, order) {
      particles.push({
        ...point,
        kind,
        order,
        word: words[Math.floor(Math.random() * words.length)],
        colorIndex: Math.floor(Math.random() * colors.length),
        alpha: 0,
        flicker: random(0, Math.PI * 2),
        size: random(.85, 1.15),
        delay: 0
      });
    }

    function buildParticles() {
      particles.length = 0;
      const outlinePoints = [];
      for (let index = 0; index < 160; index += 1) {
        const point = screenPoint(heartPoint(index / 160 * Math.PI * 2));
        if (outlinePoints.every((placed) => Math.hypot(point.x - placed.x, point.y - placed.y) >= 30)) {
          outlinePoints.push(point);
          addParticle(point, 'outline', index);
        }
      }

      const fillPoints = [];
      let attempts = 0;
      while (fillPoints.length < 130 && attempts < 10400) {
        attempts += 1;
        const point = screenPoint(heartPoint(random(0, Math.PI * 2)), random(0, .86));
        if (fillPoints.every((placed) => Math.hypot(point.x - placed.x, point.y - placed.y) >= 46)) {
          fillPoints.push(point);
          addParticle(point, 'fill', Math.floor(random(0, 321)));
        }
      }

      const outlineSpan = Math.max(...particles.filter((particle) => particle.kind === 'outline').map((particle) => particle.order), 0);
      const fillStart = outlineSpan * 1.6 + 30;
      particles.forEach((particle) => {
        particle.delay = particle.kind === 'outline' ? particle.order * 1.6 : fillStart + particle.order;
      });
      centerStart = fillStart + 120;
    }

    function drawParticle(particle) {
      if (frame > particle.delay && particle.alpha < 255) particle.alpha = Math.min(255, particle.alpha + 14 + Math.floor(random(0, 5)));
      const flicker = particle.alpha >= 255 ? .58 + .42 * Math.sin(frame * .15 + particle.flicker) ** 2 : 1;
      const alpha = particle.alpha * flicker / 255;
      if (alpha <= 0) return;
      const pulse = 1 + .16 * Math.sin(frame * .11 + particle.flicker);
      const size = (particle.kind === 'outline' ? 20 : 17) * particle.size * pulse * (1 + beatIntensity * .22);
      const shake = particle.alpha >= 255 ? random(-1.4 - beatIntensity * 8, 1.4 + beatIntensity * 8) : 0;
      const colorPalette = colorMode === 'red' ? redColors : colors;
      const color = colorPalette[particle.colorIndex];
      context.save();
      context.globalAlpha = alpha / 7;
      context.font = `700 ${size}px Arial`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.shadowColor = color;
      context.shadowBlur = size * 1.9;
      context.fillStyle = color;
      context.fillText(particle.word, particle.x + shake, particle.y + shake);
      context.globalAlpha = alpha;
      context.shadowBlur = size * (1.15 + beatIntensity * 2.5);
      context.fillText(particle.word, particle.x + shake, particle.y + shake);
      context.restore();
    }

    function drawCenter() {
      const currentTime = music.currentTime;
      if (currentTime < beatDropStart || currentTime >= beatDropEnd) return;
      const inWhitePulseWindow = true;
      const alpha = 1;
      const pulseWave = Math.sin(frame * (inWhitePulseWindow ? .28 : .15)) ** 2;
      let message = '';
      let typingProgress = 0;
      if (currentTime < firstTypeEnd) {
        typingProgress = (currentTime - beatDropStart) / (firstTypeEnd - beatDropStart);
        message = centerMessage.slice(0, Math.ceil(centerMessage.length * typingProgress));
      } else if (currentTime < firstDeleteStart) {
        typingProgress = 1;
        message = centerMessage;
      } else if (currentTime < secondTypeStart) {
        const deleteProgress = (currentTime - firstDeleteStart) / (secondTypeStart - firstDeleteStart);
        typingProgress = 1 - deleteProgress;
        message = centerMessage.slice(0, Math.ceil(centerMessage.length * typingProgress));
      } else {
        typingProgress = Math.min(1, (currentTime - secondTypeStart) / (secondTypeEnd - secondTypeStart));
        message = secondaryMessage.slice(0, Math.ceil(secondaryMessage.length * typingProgress));
      }
      const pulse = 1 + .055 * pulseWave + beatIntensity * .14 + (inWhitePulseWindow ? .16 * pulseWave : 0);
      const glitchText = inWhitePulseWindow && (Math.random() < .24 || beatIntensity > .85);
      context.save();
      context.globalAlpha = inWhitePulseWindow ? .28 + .35 * pulseWave : alpha / 5;
      context.font = `700 ${42 * pulse}px Georgia`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.shadowColor = '#fffaf5';
      context.shadowBlur = 34 + 18 * pulseWave + (inWhitePulseWindow ? 42 * pulseWave : 0);
      context.fillStyle = '#fffaf5';
      if (glitchText) {
        context.globalCompositeOperation = 'screen';
        context.globalAlpha = .5;
        context.fillStyle = '#ff174f';
        context.fillText(` ${message} `, width / 2 + random(-12, 12), height / 2 + random(-3, 3));
        context.fillStyle = '#29b6ff';
        context.fillText(` ${message} `, width / 2 + random(-12, 12), height / 2 + random(-3, 3));
        context.globalCompositeOperation = 'source-over';
        context.globalAlpha = inWhitePulseWindow ? .28 + .35 * pulseWave : alpha / 5;
        context.fillStyle = '#fffaf5';
      }
      context.fillText(` ${message}${typingProgress < 1 ? '|' : ''} `, width / 2, height / 2);
      context.globalAlpha = inWhitePulseWindow ? .72 + .28 * pulseWave : alpha;
      context.shadowBlur = 10 + (inWhitePulseWindow ? 24 * pulseWave : 0);
      context.fillText(` ${message}${typingProgress < 1 ? '|' : ''} `, width / 2, height / 2);
      context.restore();
    }

    function setupAudioAnalysis() {
      if (audioContext) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = .55;
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
      const source = audioContext.createMediaElementSource(music);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
    }

    function updateBeat() {
      if (!analyser || music.paused) {
        beatIntensity *= .92;
        return;
      }
      if (music.currentTime < beatDropStart) {
        beatDropActivated = false;
        colorMode = 'blue';
        lastColorPhase = -1;
        beatIntensity *= .9;
        return;
      }
      if (music.currentTime < beatDropEnd) {
        const colorPhase = Math.floor((music.currentTime - beatDropStart) / colorPhaseLength);
        if (colorPhase !== lastColorPhase) {
          lastColorPhase = colorPhase;
          colorMode = colorPhase % 2 === 0 ? 'red' : 'blue';
          particles.forEach((particle) => {
            particle.colorIndex = Math.floor(Math.random() * colors.length);
          });
        }
        beatDropActivated = true;
        beatIntensity = colorMode === 'red' ? 1 : .58;
        return;
      }
      if (!beatDropActivated) {
        beatDropActivated = true;
        beatIntensity = 1;
        beatCooldown = 14;
      }
      analyser.getByteFrequencyData(frequencyData);
      let bassTotal = 0;
      const bassBins = Math.max(2, Math.floor(frequencyData.length * .16));
      for (let index = 0; index < bassBins; index += 1) bassTotal += frequencyData[index];
      const bass = bassTotal / bassBins / 255;
      beatAverage = beatAverage * .94 + bass * .06;
      if (beatCooldown > 0) beatCooldown -= 1;
      if (bass > Math.max(.32, beatAverage * 1.45) && beatCooldown === 0) {
        beatIntensity = 1;
        beatCooldown = 10;
        colorMode = 'red';
      } else {
        beatIntensity *= .86;
        if (beatIntensity < .08) colorMode = 'blue';
      }
    }

    function drawBeatGlitch() {
      if (beatIntensity < .12) return;
      context.save();
      context.globalAlpha = beatIntensity * .65;
      context.strokeStyle = colorMode === 'red' ? (frame % 2 ? '#ff174f' : '#ff8b9f') : '#35c7ff';
      context.lineWidth = 1 + beatIntensity * 3;
      for (let index = 0; index < 14; index += 1) {
        const y = random(0, height);
        const x = random(0, width * .82);
        context.beginPath();
        context.moveTo(x, y);
        context.lineTo(Math.min(width, x + random(20, 180) * beatIntensity), y + random(-4, 4));
        context.stroke();
      }
      context.restore();
    }

    function drawCorruption() {
      if (beatIntensity < .12) return;
      const corruption = Math.min(1, beatIntensity * 1.25);
      context.save();
      context.globalCompositeOperation = 'screen';
      context.globalAlpha = corruption * .7;
      for (let index = 0; index < 9 + Math.floor(corruption * 12); index += 1) {
        const y = random(0, height);
        const sliceHeight = random(1, 8 + corruption * 14);
        const x = random(-width * .1, width * .8);
        const sliceWidth = random(width * .05, width * .55);
        context.fillStyle = index % 2 ? '#ff174f' : '#29b6ff';
        context.fillRect(x + random(-18, 18) * corruption, y, sliceWidth, sliceHeight);
      }
      context.globalCompositeOperation = 'source-over';
      context.globalAlpha = corruption * .5;
      context.fillStyle = '#020208';
      for (let index = 0; index < 4 + Math.floor(corruption * 5); index += 1) {
        context.fillRect(0, random(0, height), width * random(.15, .8), random(1, 5 + corruption * 8));
      }
      context.globalAlpha = corruption * .16;
      context.fillStyle = '#ffffff';
      for (let y = 0; y < height; y += 5) context.fillRect(0, y, width, 1);
      context.restore();
    }

    function animate() {
      frame += 1;
      updateBeat();
      context.clearRect(0, 0, width, height);
      const flashCycle = Math.sin(frame * .12) ** 16;
      const shakeAmount = beatIntensity * 14 + flashCycle * 3;
      context.save();
      context.translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount));
      if (flashCycle > .02 || beatIntensity > .08) {
        const flash = Math.max(flashCycle, beatIntensity * .7);
        context.fillStyle = colorMode === 'red'
          ? `rgba(255, 0, 52, ${flash * .2})`
          : `rgba(0, 90, 255, ${flash * .11})`;
        context.fillRect(0, 0, width, height);
      }
      particles.forEach(drawParticle);
      drawCenter();
      drawBeatGlitch();
      context.restore();
      drawCorruption();
      requestAnimationFrame(animate);
    }

    function startMusic() {
      if (autoplayStarted) return;
      setupAudioAnalysis();
      if (audioContext && audioContext.state === 'suspended') audioContext.resume();
      music.play().then(() => {
        autoplayStarted = true;
        soundButton.textContent = 'Music on';
      }).catch(() => {
        soundButton.textContent = 'Tap for music';
      });
    }

    soundButton.addEventListener('click', () => {
      startMusic();
    });
    window.addEventListener('resize', () => { resize(); buildParticles(); });
    resize();
    buildParticles();
    animate();
    startMusic();
  </script>
</body>
</html>
